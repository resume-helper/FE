name: CD (Docker / EC2)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    name: Build & Deploy frontend to EC2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (standalone)
        run: |
          echo "NEXT_PUBLIC_BACKEND_API_URL=http://backend:8080/api" > .env.production
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Open SSH for runner IP
        id: sg
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32" || true

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/key.pem
          chmod 600 /tmp/key.pem

      - name: Ship standalone build to EC2
        run: |
          SSHO="ssh -i /tmp/key.pem -o StrictHostKeyChecking=no"
          $SSHO ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'mkdir -p ~/app/FE/.next'
          rsync -az --delete -e "$SSHO" .next/standalone/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:'~/app/FE/.next/standalone/'
          rsync -az --delete -e "$SSHO" .next/static/    ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:'~/app/FE/.next/static/'
          rsync -az          -e "$SSHO" public/          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:'~/app/FE/public/'
          rsync -az          -e "$SSHO" Dockerfile       ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:'~/app/FE/'

      - name: Compose up frontend + check
        run: |
          ssh -i /tmp/key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'cd ~/app/deploy && docker compose up -d --build frontend && \
             curl -s --retry 20 --retry-delay 2 --retry-all-errors -o /dev/null -w "frontend: %{http_code}\n" http://localhost/'

      - name: Close SSH for runner IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr "${{ steps.sg.outputs.ip }}/32" || true
